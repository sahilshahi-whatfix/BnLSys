<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teams · Nodeway</title>
<style>
:root{color-scheme:light;--bg:#f5f5fa;--sf:#ffffff;--tx:#242424;--mu:#616161;--bd:#e0e0e8;--ac:#5b5fc7;--acbg:#e8ebfa;--ok:#237b4b;--okbg:#e0f3e8;--wn:#8a5300;--wnbg:#fdf0d9;--tb:#464775;--tbt:#ffffff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.top{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--tb);color:var(--tbt);flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:-.4px;white-space:nowrap}
.search{flex:1;min-width:160px;max-width:420px;padding:7px 14px;border-radius:18px;background:rgba(127,127,127,.16);opacity:.85;font-size:13px}
.tenant{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px;opacity:.95}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.shell{display:flex;max-width:1180px;margin:0 auto}
.side{width:200px;flex:none;padding:18px 12px;display:flex;flex-direction:column;gap:2px}
.side h4{margin:0 8px 10px;font-size:12px;color:var(--mu);font-weight:600}
.side button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;color:var(--mu);cursor:pointer}
.side button[aria-selected="true"]{background:var(--sf);color:var(--tx);font-weight:600;box-shadow:0 0 0 1px var(--bd)}
.cnt{background:var(--ac);color:#fff;border-radius:10px;padding:0 8px;font-size:12px;font-weight:700}
.main{flex:1;min-width:0;padding:20px 20px 40px}
.pg{display:none}.pg.on{display:block}
h1{margin:0 0 4px;font-size:22px;font-weight:600}
.sub{color:var(--mu);margin-bottom:14px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;margin-bottom:14px}
.ch{padding:11px 16px;font-weight:600;border-bottom:1px solid var(--bd)}
.cb{padding:16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px 18px}
.fld label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
.fld input[type=text],.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;background:var(--sf)}
.fld.chk{display:flex;gap:8px;align-items:center;padding:6px 0}.fld.chk label{margin:0;font-size:14px;color:var(--tx)}
.btn{padding:8px 20px;border-radius:20px;border:1px solid var(--ac);background:var(--sf);color:var(--ac);font-weight:600;cursor:pointer}
.btn.pri{background:var(--ac);color:#fff}
.btn.sm{padding:4px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;padding:1px 10px;border-radius:11px;font-size:12px;font-weight:600;background:var(--bg);color:var(--mu);border:1px solid var(--bd);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok);border-color:transparent}.chip.wn{background:var(--wnbg);color:var(--wn);border-color:transparent}.chip.bl{background:var(--acbg);color:var(--ac);border-color:transparent}
.banner{margin:0 0 14px;padding:10px 16px;border-radius:10px;background:var(--acbg);color:var(--ac)}
.banner.ok{background:var(--okbg);color:var(--ok)}.banner.wn{background:var(--wnbg);color:var(--wn)}
.empty{padding:34px 16px;text-align:center;color:var(--mu)}
.row{display:flex;gap:14px;padding:13px 16px;border-bottom:1px solid var(--bd);align-items:flex-start}
.row:last-child{border-bottom:0}
.dot{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--okbg);color:var(--ok)}
.dot.wn{background:var(--wnbg);color:var(--wn)}.dot.gy{background:var(--bg);color:var(--mu);border:1px solid var(--bd)}
.t{font-weight:600}.s{color:var(--mu);font-size:13px}
.r{margin-left:auto;text-align:right;white-space:nowrap;font-size:12.5px;color:var(--mu)}
table.tb{width:100%;border-collapse:collapse}
.tb th{text-align:left;font-size:12px;color:var(--mu);font-weight:600;padding:9px 14px;border-bottom:1px solid var(--bd)}
.tb td{padding:10px 14px;border-bottom:1px solid var(--bd);vertical-align:middle}
.tb tr:last-child td{border-bottom:0}
.tb select{padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--sf)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1px;background:var(--bd);border-radius:10px;overflow:hidden}
.kv{background:var(--sf);padding:11px 16px}.kv span{display:block;font-size:12px;color:var(--mu)}.kv b{font-weight:500}
.toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#1d2530;color:#fff;padding:9px 18px;border-radius:8px;font-size:13px;z-index:50;display:none}
.toast.on{display:block}
.rs{background:none;border:0;color:var(--mu);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:18px}
footer{text-align:center;color:var(--mu);font-size:12px;padding:18px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:760px){.shell{flex-direction:column}.side{width:auto;flex-direction:row;overflow-x:auto;padding:10px 12px}.side h4{display:none}.side button{white-space:nowrap}.row{flex-wrap:wrap}.r{margin-left:40px;text-align:left}.tenant span{display:none}}


</style>
</head>
<body>
<div class="toast" id="toast" role="status"></div>
<div class="top"><div class="logo">Teams</div><div class="search">Search</div><div class="tenant"><span>Nodeway</span><div class="av" style="background:#0f7b6c" title="Nodeway">DW</div></div></div>
<div class="shell">
<nav class="side" role="tablist" id="nav"></nav>
<main class="main">

<section class="pg on" id="p-main"><h1 id="tmTitle"></h1><div class="sub" id="tmSubT"></div>
 <div style="margin-bottom:10px" id="tmTools"><button class="btn sm" id="tmAdd">Add people</button></div>
 <div class="card" id="tmAddRow" style="display:none"><div class="cb" style="display:flex;gap:10px;align-items:end;flex-wrap:wrap"><div class="fld" style="flex:1;min-width:200px"><label for="tmAddIn">Name or email</label><input type="text" id="tmAddIn" autocomplete="off"></div><button class="btn pri" id="tmAddGo">Add</button></div></div>
 <div class="card" id="tmMsgs" style="min-height:160px"></div>
 <div class="card cb" style="display:flex;gap:10px"><input type="text" id="tmIn" placeholder="Type a message" style="flex:1;padding:8px 12px;border:1px solid var(--bd);border-radius:6px;background:var(--sf)" autocomplete="off" aria-label="Message"><button class="btn pri" id="tmSend">Send</button></div></section>

<button class="rs" id="reset">Reset demo</button>
</main>
</div>
<footer>Demo environment · fictional data · Nodeway</footer>
<script>
var NAVTITLE="Chats and channels";

function el(i){return document.getElementById(i)}
function toast(t){var e=el("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(function(){e.classList.remove("on")},2600)}
var PAGE="";
function drawNav(){el("nav").innerHTML='<h4>'+NAVTITLE+'</h4>'+NAV.map(function(n){return '<button role="tab" data-p="'+n[0]+'" id="nav-'+n[0]+'" aria-selected="'+(PAGE===n[0])+'"><span>'+n[1]+'</span>'+(BADGE(n[0])||"")+'</button>'}).join("")}
function go(p){PAGE=p;NAV.forEach(function(n){var s=el("p-"+n[0]);if(s)s.classList.toggle("on",n[0]===p)});drawNav()}
el("nav").addEventListener("click",function(e){var b=e.target.closest("button[data-p]");if(b)go(b.dataset.p)});
function fieldHTML(f,form){var id="in-"+form+"-"+f.id;
  if(f.k==="check")return '<div class="fld chk"><input type="checkbox" id="'+id+'"><label for="'+id+'">'+f.l+'</label></div>';
  if(f.k==="select")return '<div class="fld"><label for="'+id+'">'+f.l+'</label><select id="'+id+'">'+f.o.map(function(o){return '<option>'+o+'</option>'}).join("")+'</select></div>';
  return '<div class="fld"><label for="'+id+'">'+f.l+'</label><input type="text" id="'+id+'" autocomplete="off"></div>'}
function buildForm(target,form,fields){el(target).innerHTML=fields.map(function(f){return fieldHTML(f,form)}).join("")}
function hashTok(){return (location.hash||"").replace("#","")}


var NAV=[["c1","# platform-engineering"],["c2","# nodeway-new-joiners"],["dm","Sarah Palmer"]];
function BADGE(p){return ""}
var T;
function init(){T={c1:{t:"# platform-engineering",n:16,m:[["David Chen","Sprint review notes are posted in the channel files."]]},c2:{t:"# nodeway-new-joiners",n:38,m:[["Nodeway People Team","Welcome to the January 2027 cohort. Say hello here."]]},dm:{t:"Sarah Palmer",n:0,m:[]}};el("tmAddRow").style.display="none";el("tmAddIn").value="";el("tmIn").value="";go("c1");render()}
function render(){
  var c=T[PAGE];if(!c)return;
  el("tmTitle").textContent=c.t;el("tmSubT").textContent=PAGE==="dm"?"Direct chat":c.n+" members";
  el("tmTools").style.display=PAGE==="dm"?"none":"block";
  el("tmMsgs").innerHTML=c.m.length?c.m.map(function(m){return m[0]===""?'<div class="row"><div class="s" style="width:100%;text-align:center">'+m[1]+'</div></div>':'<div class="row"><div class="av" style="background:var(--ac)">'+m[0].split(" ").map(function(w){return w[0]}).join("").slice(0,2)+'</div><div><div class="t">'+m[0]+'</div><div>'+m[1]+'</div></div></div>'}).join(""):'<div class="empty">No messages yet.</div>';
}
var _go=go;go=function(p){_go(p);el("tmAddRow").style.display="none";render()};
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.id==="tmAdd"){el("tmAddRow").style.display="block"}
  else if(t.id==="tmAddGo"){var v=el("tmAddIn").value.trim();if(!v){toast("Enter a name");return}T[PAGE].n++;T[PAGE].m.push(["",v+" was added to the channel"]);el("tmAddRow").style.display="none";el("tmAddIn").value="";render();toast("Added "+v)}
  else if(t.id==="tmSend"){var m=el("tmIn").value.trim();if(!m)return;T[PAGE].m.push(["Dana Whitfield",m]);el("tmIn").value="";render()}
  else if(t.id==="reset"){init()}
});
init();

</script>
</body>
</html>
