<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Gmail · Angella Smith (HRBP)</title>
<style>
:root{color-scheme:light;--bg:#f6f8fc;--sf:#ffffff;--tx:#1f1f1f;--mu:#444746;--mu2:#5f6368;--bd:#e0e3e7;--sel:#d3e3fd;--hv:#eaf1fb;--hv2:#f2f6fc;--rd:#d93025;--ac:#0b57d0;--ok:#188038;--okbg:#e6f4ea;--wn:#8a5300;--wnbg:#fef3d6;--cmp:#c2e7ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:currentColor;flex:none;display:block}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:var(--mu)}
.ib:hover{background:rgba(68,71,70,.08)}
.ib.sm{width:32px;height:32px}.ib.sm svg.i{width:18px;height:18px}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:8px 16px 8px 8px;height:64px}
.logo{display:flex;align-items:center;gap:6px;font-size:22px;color:var(--mu);min-width:200px;padding-left:4px}
.logo svg{width:32px;height:24px}
.search{flex:1;max-width:720px;display:flex;align-items:center;gap:10px;height:48px;padding:0 6px 0 4px;border-radius:24px;background:#e9eef6;color:var(--mu)}
.search span{flex:1}
.acct{margin-left:auto;display:flex;align-items:center;gap:4px}
.acct .who{display:flex;flex-direction:column;align-items:flex-end;margin-right:6px;line-height:1.2}
.acct .who b{font-size:13px;font-weight:500}.acct .who small{color:var(--mu2);font-size:12px}
.av{width:32px;height:32px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:500;font-size:14px;flex:none}
.av.lg{width:40px;height:40px;font-size:16px}

/* layout */
.lay{display:grid;grid-template-columns:256px 1fr;padding:0 16px 16px 0;height:calc(100vh - 64px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:520px}
.nav{padding:4px 0 0}
.compose{display:inline-flex;align-items:center;gap:12px;background:var(--cmp);color:#001d35;border:0;border-radius:16px;height:56px;padding:0 24px 0 18px;font-weight:500;margin:0 0 16px 8px;cursor:pointer;box-shadow:none;transition:box-shadow .15s}
.compose:hover{box-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 8px 3px rgba(60,64,67,.15)}
.compose svg.i{width:24px;height:24px}
.nav .f{display:flex;align-items:center;gap:18px;width:calc(100% - 12px);height:32px;border:0;background:none;color:var(--tx);padding:0 12px 0 26px;border-radius:0 16px 16px 0;cursor:pointer;text-align:left;font-size:14px}
.nav .f:hover{background:rgba(31,31,31,.06)}
.nav .f.on{background:var(--sel);font-weight:700;color:#001d35}
.nav .f span:nth-child(2){flex:1}
.nav .f small{font-size:12px;font-weight:700}
.pane{background:var(--sf);border-radius:16px;min-height:0;overflow:hidden;display:grid;grid-template-columns:minmax(280px,400px) 1fr}
.list{border-right:1px solid var(--bd);overflow-y:auto;min-height:0}
.tool{display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:1px solid var(--bd);height:48px}
.tool .lbl{font-size:12px;color:var(--mu2);margin-left:auto;padding-right:8px}
.msg{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid #f1f3f4;background:none;color:var(--tx);padding:10px 16px 10px 20px;cursor:pointer;position:relative}
.msg:hover{box-shadow:inset 1px 0 0 #dadce0,inset -1px 0 0 #dadce0,0 1px 2px 0 rgba(60,64,67,.3),0 1px 3px 1px rgba(60,64,67,.15);z-index:1}
.msg.on{background:#c2dbff}
.msg .fr{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.msg .fr b{font-weight:400}.msg.unread .fr b,.msg.unread .sub,.msg.unread .tm{font-weight:700;color:var(--tx)}
.msg.unread{background:var(--sf)}.msg:not(.unread):not(.on){background:#f2f6fc}
.msg .tm{font-size:12px;color:var(--mu2);white-space:nowrap}
.msg .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .sn{color:var(--mu2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg .clip{display:inline-flex;align-items:center;gap:4px;margin-top:6px;border:1px solid #dadce0;border-radius:16px;padding:2px 10px 2px 6px;font-size:12px;color:var(--mu)}
.msg .clip i{display:inline-block;width:14px;height:14px;border-radius:2px;background:var(--rd)}

/* reading pane */
.read{overflow-y:auto;min-height:0;padding:0 0 40px}
.rtool{display:flex;align-items:center;gap:2px;padding:4px 8px;height:48px;position:sticky;top:0;background:var(--sf);z-index:2}
.rtool .back{display:none}
.subj{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:8px 24px 18px 72px}
.subj h1{margin:0;font-size:22px;font-weight:400;line-height:1.35}
.lbl-chip{font-size:12px;background:#ddd;color:#444;border-radius:4px;padding:0 6px}
.mail{display:grid;grid-template-columns:40px 1fr;gap:0 16px;padding:0 24px 0 16px}
.mhd{display:flex;align-items:flex-start;gap:8px;min-height:40px}
.mhd .who{flex:1;min-width:0}
.mhd .who b{font-weight:700;font-size:14px}.mhd .who .em{color:var(--mu2);font-size:12px;margin-left:4px}
.mhd .to{color:var(--mu2);font-size:12px;display:flex;align-items:center;gap:2px}
.mhd .to svg{width:16px;height:16px}
.mhd .tm{color:var(--mu2);font-size:12px;white-space:nowrap;padding-top:2px}
.mhd .acts{display:flex;align-items:center;margin-top:-6px}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:0 6px;background:var(--okbg);color:var(--ok);margin-left:8px;font-weight:500}
.body{max-width:720px;padding:14px 0 6px;font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.55}
.body p{margin:0 0 12px}
.body a{color:var(--ac)}
.thread-sep{border:0;border-top:1px solid var(--bd);margin:16px 24px 16px 72px}

/* attachments */
.attwrap{margin:8px 0 6px;padding-top:14px;border-top:1px solid #e9eaed;max-width:760px}
.atthd{font-size:14px;color:var(--mu);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.atthd b{font-weight:500;color:var(--tx)}
.atthd small{color:var(--mu2);font-size:12px;display:inline-flex;align-items:center;gap:4px}
.atts{display:flex;flex-wrap:wrap;gap:12px}
.att{position:relative;width:180px;height:122px;border:1px solid #e0e0e0;border-radius:6px;overflow:hidden;cursor:pointer;background:#f1f3f4;padding:0;text-align:left}
.att img{position:absolute;inset:0;width:100%;height:calc(100% - 34px);object-fit:cover;object-position:top center}
.att .cap{position:absolute;left:0;right:0;bottom:0;height:34px;background:#f5f5f5;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:12.5px;font-weight:500;color:var(--tx)}
.att .cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdfic{width:16px;height:16px;flex:none;border-radius:2px;background:#ea4335;color:#fff;font:700 6px/16px Arial,sans-serif;text-align:center;letter-spacing:-.2px}
.att .hov{position:absolute;inset:0;background:rgba(32,33,36,.72);color:#fff;display:none;flex-direction:column;justify-content:space-between;padding:10px}
.att:hover .hov,.att:focus-visible .hov{display:flex}
.att .hov b{font-weight:500;font-size:13px;word-break:break-all;line-height:1.3}
.att .hov small{opacity:.85;font-size:12px}
.att .hov .dl{align-self:flex-end;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;color:#fff}

/* reply buttons and inline reply */
.rbtns{display:flex;gap:12px;padding:20px 24px 0 72px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 20px 0 14px;border:1px solid #747775;border-radius:18px;background:var(--sf);color:var(--mu);font-weight:500;cursor:pointer}
.pill:hover{background:#f3f6fb}
.pill svg.i{width:18px;height:18px}
.rbox{display:grid;grid-template-columns:40px 1fr;gap:16px;padding:20px 24px 0 16px}
.rcard{border-radius:8px;box-shadow:0 1px 2px 0 rgba(60,64,67,.3),0 2px 6px 2px rgba(60,64,67,.15);background:var(--sf);display:flex;flex-direction:column;min-width:0}
.rhd{display:flex;align-items:center;gap:6px;padding:6px 8px 4px 8px;min-height:44px;flex-wrap:wrap}
.rmode{display:inline-flex;align-items:center;gap:0;border:0;background:none;color:var(--mu);border-radius:4px;padding:4px;cursor:pointer}
.rmode:hover{background:rgba(68,71,70,.08)}
.rmode svg.i{width:20px;height:20px}.rmode svg.c{width:18px;height:18px;fill:currentColor}
.chipr{display:inline-flex;align-items:center;gap:6px;height:28px;border-radius:14px;background:#e8f0fe;color:#1f1f1f;padding:0 10px 0 2px;font-size:13.5px}
.chipr .av{width:24px;height:24px;font-size:11px}
.rto{flex:1;min-width:160px;border:0;outline:0;padding:6px 4px;font:inherit;background:none}
.rbody{border:0;outline:0;resize:none;width:100%;min-height:180px;max-height:60vh;padding:6px 16px 10px;font:14px/1.6 Arial,Helvetica,sans-serif;color:var(--tx);background:none;overflow-y:auto}
.trim{margin:0 16px 10px;width:28px;height:14px;border:0;border-radius:7px;background:#e8eaed;color:var(--mu);font:700 11px/10px Arial;padding:0 0 4px;cursor:pointer}
.quoted{display:none;margin:0 16px 12px;padding-left:12px;border-left:1px solid #ccc;color:var(--mu2);font:13px/1.5 Arial,sans-serif}
.quoted.on{display:block}
.rfoot,.cfoot{display:flex;align-items:center;gap:2px;padding:8px 8px 10px 16px}
.sendg{display:inline-flex;height:36px;border-radius:18px;overflow:hidden;margin-right:10px;flex:none}
.sendg button{border:0;background:var(--ac);color:#fff;cursor:pointer;font-weight:500}
.sendg .send{padding:0 16px 0 20px;font-size:14px}
.sendg .caret{width:30px;display:grid;place-items:center;border-left:1px solid rgba(255,255,255,.35)}
.sendg button:hover{background:#0a4dbb;box-shadow:0 1px 3px rgba(60,64,67,.3)}
.sendg .caret svg{width:20px;height:20px;fill:#fff}
.tb-ic{display:flex;align-items:center;gap:0;flex-wrap:wrap}
.spacer{flex:1}

/* compose window (bottom right, like Gmail) */
.cw{position:fixed;right:16px;bottom:0;width:560px;max-width:calc(100vw - 24px);height:min(600px,calc(100vh - 80px));background:var(--sf);border-radius:8px 8px 0 0;box-shadow:0 8px 10px 1px rgba(0,0,0,.14),0 3px 14px 2px rgba(0,0,0,.12),0 5px 5px -3px rgba(0,0,0,.2);display:none;flex-direction:column;z-index:40;overflow:hidden}
.cw.on{display:flex}
.cw.min{height:40px}
.cw.min .cbody,.cw.min .crow,.cw.min .cfoot{display:none}
.cw.max{right:50%;bottom:50%;transform:translate(50%,50%);width:min(1100px,calc(100vw - 80px));height:calc(100vh - 80px);border-radius:8px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39;display:none}
.scrim.on{display:block}
.chd{display:flex;align-items:center;height:40px;padding:0 6px 0 16px;background:var(--hv2);font-size:14px;font-weight:500;cursor:default;flex:none}
.chd span{flex:1}
.chd .ib{width:28px;height:28px;color:var(--mu)}
.chd .ib svg.i{width:18px;height:18px}
.crow{display:flex;align-items:center;gap:8px;margin:0 16px;border-bottom:1px solid #f1f3f4;min-height:40px;flex:none}
.crow label{color:var(--mu2);font-size:14px;min-width:0}
.crow input,.crow select{flex:1;border:0;background:none;outline:0;padding:8px 0;font:inherit;color:var(--tx);min-width:0}
.crow .ccb{color:var(--mu);font-size:14px;margin-left:auto;white-space:nowrap}
.cbody{flex:1;min-height:0;border:0;outline:0;resize:none;padding:12px 16px;font:14px/1.6 Arial,Helvetica,sans-serif;color:var(--tx);background:none;width:100%}

/* PDF viewer (Gmail attachment preview) */
.pv{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:none;flex-direction:column}
.pv.on{display:flex}
.pvh{display:flex;align-items:center;gap:8px;height:64px;padding:0 12px;color:#fff;flex:none;background:linear-gradient(rgba(0,0,0,.65),rgba(0,0,0,0))}
.pvh .ib{color:#fff}.pvh .ib:hover{background:rgba(255,255,255,.12)}
.pvh .nm{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;min-width:0}
.pvh .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pvh .pdfic{width:20px;height:20px;font-size:7px;line-height:20px}
.pvh a.ib{text-decoration:none}
.pvb{flex:1;overflow:auto;padding:8px 16px 90px}
.pvb img{display:block;margin:0 auto 16px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.5);height:auto;transition:width .15s}
.pvf{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:rgba(32,33,36,.92);color:#e8eaed;border-radius:8px;padding:4px 8px;font-size:13px;z-index:61}
.pvf .ib{width:32px;height:32px;color:#e8eaed}.pvf .ib:hover{background:rgba(255,255,255,.12)}
.pvf .sep{width:1px;height:20px;background:#5f6368;margin:0 6px}

/* misc content styles used in messages */
.chk{list-style:none;margin:6px 0 16px;padding:0}
.chk li{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--bd)}
.chk li:last-child{border-bottom:0}
.box{width:20px;height:20px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;margin-top:1px}
.box.todo{background:none;border:2px solid var(--wn);color:var(--wn)}
.todo-row{background:var(--wnbg);border-radius:8px;padding:10px 12px!important;border-bottom:0!important}
.foot{margin-top:20px;font-size:12px;color:var(--mu2);border-top:1px solid var(--bd);padding-top:10px}
.apbtn{display:inline-block;background:#0b57d0;color:#fff!important;border-radius:6px;padding:10px 22px;font-weight:600;text-decoration:none}
.apbtn:hover{filter:brightness(1.1)}
.empty{padding:40px;text-align:center;color:var(--mu2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{position:fixed;left:24px;bottom:24px;background:#303030;color:#f2f2f2;padding:14px 24px;border-radius:4px;font-size:14px;z-index:70;display:none;box-shadow:0 3px 5px -1px rgba(0,0,0,.2),0 6px 10px rgba(0,0,0,.14)}
.toast.on{display:block}
.rs{position:fixed;left:12px;bottom:6px;background:none;border:0;color:var(--mu2);font-size:12px;text-decoration:underline;cursor:pointer;z-index:5}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:900px){
 .logo{min-width:0}.logo b{display:none}.acct .who{display:none}
 .lay{grid-template-columns:1fr;padding:0 8px 8px;height:auto;min-height:0}
 .nav{display:flex;gap:4px;overflow-x:auto;align-items:center;padding-bottom:8px}
 .compose{height:44px;margin:0 6px 0 0;padding:0 16px}
 .nav .f{width:auto;border-radius:16px;white-space:nowrap;gap:8px;padding:0 12px}
 .pane{grid-template-columns:1fr;min-height:70vh}.read{display:none}
 .pane.reading .list{display:none}.pane.reading .read{display:block}.rtool .back{display:grid}
 .subj{margin-left:16px}.rbtns{padding-left:16px}.thread-sep{margin-left:16px}
 .mail,.rbox{grid-template-columns:32px 1fr;gap:0 10px;padding:0 12px}
 .cw{right:0;max-width:100vw;width:100vw;height:calc(100vh - 40px)}
}
</style>
</head>

  el("rSlot").innerHTML='<div class="rbox"><span class="av lg" style="background:'+me.col+'">'+me.ini+'</span><div class="rcard">'+
   '<div class="rhd"><button class="rmode" id="rMode" title="Type of response">'+ic(fwd?"forward":"reply")+'<svg class="c"><use href="#i-drop"/></svg></button>'+chip+'</div>'+
   '<textarea class="rbody" id="rBody" aria-label="Message Body"></textarea>'+
   '<button class="trim" id="rTrim" title="Show trimmed content" aria-label="Show trimmed content">•••</button>'+
   '<div class="quoted" id="rQuote">'+(fwd?'---------- Forwarded message ---------<br>From: <b>'+escH(m.from)+'</b> &lt;'+escH(m.em)+'&gt;<br>Date: '+m.full+'<br>Subject: '+m.subj+'<br>To: '+escH(m.to)+'<br><br>':'On '+m.full+', '+escH(m.from)+' &lt;'+escH(m.em)+'&gt; wrote:<br>')+m.body+'</div>'+
   '<div class="rfoot"><div class="sendg"><button class="send" id="rSend">Send</button><button class="caret" aria-label="More send options"><svg><use href="#i-drop"/></svg></button></div><div class="tb-ic">'+toolbarHTML()+'</div><span class="spacer"></span><button class="ib sm" id="rDiscard" aria-label="Discard draft">'+ic("delete")+'</button></div>'+
   '</div></div>';
  var ta=el("rBody");ta.value=RB.text||"";autoGrow(ta);
  ta.addEventListener("input",function(){RB.text=ta.value;autoGrow(ta)});
  if(fwd)el("rTo").value=RB.to||"";
  el("rTo").addEventListener("input",function(e){RB.to=e.target.value});
  setTimeout(function(){(fwd&&!RB.to?el("rTo"):ta).focus()},0);
}
function autoGrow(ta){ta.style.height="auto";ta.style.height=Math.max(180,Math.min(ta.scrollHeight+2,window.innerHeight*.6))+"px"}
function openReply(mode){var m=cur();if(!m)return;RB={id:m.id,mode:mode,text:"",to:""};render();var s=el("rSlot");if(s)s.scrollIntoView({block:"nearest",behavior:"smooth"})}
function cur(){return CFG.msgs.filter(function(x){return x.id===st.id})[0]}
function sendReply(){
  var m=cur();if(!m||!RB)return;var me=CFG.acct,fwd=RB.mode==="forward";
  var extra=(el("rTo").value||"").trim(),t=replyTarget(m);
  var to=fwd?extra:t.em+(extra?", "+extra:"");
  if(!to){toast("Please specify at least one recipient.");el("rTo").focus();return}
  var text=el("rBody").value,now=new Date(),tm=now.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  var subj=(fwd?"Fwd: ":"Re: ")+m.subj.replace(/^(Re|Fwd): /,"");
  var body='<p>'+nl2br(text||"")+'</p>'+(fwd?'<div style="color:#5f6368">---------- Forwarded message ---------<br>From: '+escH(m.from)+' &lt;'+escH(m.em)+'&gt;<br>Subject: '+m.subj+'</div>'+m.body:'');
  var r={id:"r"+Date.now(),f:"sent",from:me.name,ini:me.ini,col:me.col,em:me.email,to:to,toName:fwd?to:t.name,subj:subj,sn:(text||"").replace(/\n/g," ").slice(0,90),time:tm,full:tm+" (0 minutes ago)",att:fwd?(m.att||[]).slice():[],un:0,seek:0,body:body};
  if(!fwd){m.replies=m.replies||[];m.replies.push(Object.assign({},r,{att:[]}))}
  CFG.msgs.unshift(r);RB=null;render();toast("Message sent");
}

/* compose */
function froms(){return CFG.froms||[{name:CFG.acct.name,em:CFG.acct.email,ini:CFG.acct.ini,col:CFG.acct.col}]}
function openCompose(){var F=froms();el("cFrom").innerHTML=F.map(function(f,i){return '<option value="'+i+'">'+escH(f.name)+' &lt;'+escH(f.em)+'&gt;</option>'}).join("");el("cTo").value="";el("cSub").value="";el("cBody").value="";var w=el("cmpOv");w.classList.remove("min","max");el("cmpScrim").classList.remove("on");el("cmpTitle").textContent="New Message";w.classList.add("on");el("cTo").focus()}
function closeCompose(){el("cmpOv").classList.remove("on","max","min");el("cmpScrim").classList.remove("on")}
el("cSub").addEventListener("input",function(){el("cmpTitle").textContent=el("cSub").value.trim()||"New Message"});
function sendMail(){
  var to=el("cTo").value.trim(),sub=el("cSub").value.trim(),b=el("cBody").value;
  if(!to){toast("Please specify at least one recipient.");el("cTo").focus();return}
  var f=froms()[+el("cFrom").value||0],id="sent"+(CFG.msgs.length+1),tm=new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});
  CFG.msgs.unshift({id:id,f:"sent",from:f.name,ini:f.ini,col:f.col,em:f.em,to:to,subj:escH(sub||"(no subject)"),sn:escH(b.replace(/\n/g," ").slice(0,90)),time:tm,full:tm+" (0 minutes ago)",att:[],un:0,seek:0,body:"<p>"+nl2br(b)+"</p>"});
  closeCompose();st.f="sent";st.id=id;RB=null;render();toast("Message sent");
}

/* attachment preview */
var PV=null;
function openDoc(n){var d=DOCS[n];if(!d){toast("Preview not available");return}PV=n;ZOOM=1;
  el("docTitle").textContent=n;var href="docs/"+encodeURIComponent(n);el("docDl").href=href;el("docDl").setAttribute("download",n);el("docOpen").href=href;el("docPrint").href=href;
  el("docBody").innerHTML=d.pages.map(function(p,i){return '<img src="docs/pages/'+p[0]+'" alt="'+escH(n)+', page '+(i+1)+'" data-w="'+p[1]+'">'}).join("");
  sizePages();el("docPage").textContent="Page 1 / "+d.pages.length;el("docOv").classList.add("on");el("docBody").scrollTop=0;el("docClose").focus()}
function sizePages(){var max=Math.min(el("docBody").clientWidth-32,900);el("docBody").querySelectorAll("img").forEach(function(im){var land=+im.dataset.w>1100;im.style.width=Math.round((land?Math.min(max*1.15,1100):max*0.82)*ZOOM)+"px"})}
el("docBody").addEventListener("scroll",function(){var ims=el("docBody").querySelectorAll("img"),top=el("docBody").scrollTop+80,p=1;ims.forEach(function(im,i){if(im.offsetTop<=top)p=i+1});el("docPage").textContent="Page "+p+" / "+ims.length});
window.addEventListener("resize",function(){if(PV)sizePages()});
function closeDoc(){el("docOv").classList.remove("on");PV=null}

function refresh(btn){btn.innerHTML='<span class="spin"></span>';setTimeout(function(){if(INC.length){var m=INC.shift();m.un=1;CFG.msgs.unshift(m);st.f="inbox";toast("1 new conversation")}else{toast("No new mail")}render()},700)}
document.addEventListener("click",function(e){
  var t=e.target,b=t.closest("button,a")||t,id=b.id;
  if(t.closest("[data-nodoc]")){e.stopPropagation();return}
  if(id==="gCompose"){openCompose();return}
  if(id==="gRefresh"){refresh(b);return}
  if(id==="gRefresh0"){refresh(b);return}
  if(id==="cSend"){sendMail();return}
  if(id==="cmpClose"||id==="cmpDiscard"){closeCompose();if(id==="cmpDiscard")toast("Draft discarded");return}
  if(id==="cmpMin"){el("cmpOv").classList.toggle("min");el("cmpOv").classList.remove("max");el("cmpScrim").classList.remove("on");return}
  if(id==="cmpMax"){var w=el("cmpOv");w.classList.remove("min");w.classList.toggle("max");el("cmpScrim").classList.toggle("on",w.classList.contains("max"));return}
  if(id==="cmpScrim"){el("cmpOv").classList.remove("max");el("cmpScrim").classList.remove("on");return}
  if(id==="docClose"){closeDoc();return}
  if(id==="zIn"){ZOOM=Math.min(2,ZOOM+.2);sizePages();return}
  if(id==="zOut"){ZOOM=Math.max(.5,ZOOM-.2);sizePages();return}
  if(id==="rSend"){sendReply();return}
  if(id==="rDiscard"){RB=null;render();toast("Draft discarded");return}
  if(id==="rTrim"){el("rQuote").classList.toggle("on");return}
  if(id==="rMode"){RB.mode=RB.mode==="reply"?"forward":"reply";RB.to="";render();return}
  if(id==="reset"){init();return}
  if(id==="back"){st.id=null;RB=null;render();return}
  var act=t.closest("[data-act]");if(act){openReply(act.dataset.act);return}
  var at=t.closest("[data-doc]");if(at){openDoc(at.dataset.doc);return}
  var x=t.closest("[data-id],[data-f]");if(!x)return;
  if(x.dataset.f){st.f=x.dataset.f;st.id=null;RB=null;render();return}
  if(st.id!==x.dataset.id)RB=null;
  st.id=x.dataset.id;var m=cur();if(m)m.un=0;render();
});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.classList&&e.target.classList.contains("att")){openDoc(e.target.dataset.doc);return}if(e.key==="Escape"){if(PV)closeDoc();else if(el("cmpOv").classList.contains("max")){el("cmpOv").classList.remove("max");el("cmpScrim").classList.remove("on")}}
  if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){if(document.activeElement===el("cBody"))sendMail();else if(document.activeElement&&document.activeElement.id==="rBody")sendReply()}});
function init(){CFG=JSON.parse(JSON.stringify(CFG0));INC=CFG.incoming||[];st={f:"inbox",id:null};RB=null;closeCompose();closeDoc();render()}
init();
</script>
</body>
</html>
